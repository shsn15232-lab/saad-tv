<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saad TV - Ultra Streaming</title>
    <!-- مكتبة تشغيل تدفقات IPTV والـ M3U8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #05070b;
            --card-bg: #111827;
            --accent-red: #e50914;
            --accent-glow: rgba(229, 9, 20, 0.5);
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 90px; }

        /* الهيدر العلوي */
        .top-header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            z-index: 100;
            background: linear-gradient(180deg, rgba(5,7,11,0.95) 0%, rgba(5,7,11,0) 100%);
            backdrop-filter: blur(5px);
        }
        .logo { font-size: 20px; font-weight: 900; color: var(--accent-red); letter-spacing: 1px; text-shadow: 0 0 15px var(--accent-glow); }

        /* البانر السينمائي الفخم */
        .hero {
            position: relative;
            width: 100%;
            height: 420px;
            background: url('https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=900') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 25px;
            margin-top: 0;
        }
        .hero::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(5,7,11,0.2) 30%, var(--bg-color) 100%);
        }
        .hero-content { position: relative; z-index: 2; }
        .hero-title { font-size: 28px; font-weight: 900; margin-bottom: 8px; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
        .hero-btn {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: 0.2s;
            margin-top: 10px;
        }
        .hero-btn:active { transform: scale(0.95); }

        /* الأقسام والشباك */
        .section-title { padding: 20px 20px 10px; font-size: 16px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .section-title span.red-line { border-right: 4px solid var(--accent-red); padding-right: 8px; }

        .horizontal-scroll {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 0 20px;
            scrollbar-width: none;
        }
        .horizontal-scroll::-webkit-scrollbar { display: none; }

        .media-card {
            min-width: 130px;
            width: 130px;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .media-card:active { transform: scale(0.96); }
        .media-card img { width: 100%; height: 175px; object-fit: cover; }
        .media-title { padding: 8px; font-size: 12px; font-weight: bold; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* شريط التنقل السفلي الفاخر (4 أقسام فقط كما طلبت) */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-around;
            padding: 10px 5px;
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
            flex: 1;
        }
        .nav-item.active { color: var(--accent-red); font-weight: bold; }
        .nav-item svg { width: 22px; height: 22px; margin-bottom: 4px; fill: currentColor; }

        /* نافذة مشغل الفيديو الداخلي (Modal Player) */
        #player-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        #player-modal video {
            width: 100%;
            max-height: 80vh;
            background: black;
        }
        .close-player {
            position: absolute;
            top: 20px; right: 20px;
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            z-index: 2001;
        }
    </style>
</head>
<body>

    <!-- الهيدر العلوي -->
    <div class="top-header">
        <div class="logo">SAAD TV</div>
        <div style="font-size: 18px; cursor: pointer;">🔍</div>
    </div>

    <!-- البانر الرئيسي -->
    <div class="hero" id="hero-banner">
        <div class="hero-content">
            <div class="hero-title" id="hero-title">Saad TV Pro</div>
            <button class="hero-btn" onclick="playFeatured()">تشغيل الآن 🎬</button>
        </div>
    </div>

    <!-- قسم الأفلام -->
    <div class="section-title">
        <span class="red-line">أحدث الأفلام</span>
    </div>
    <div class="horizontal-scroll" id="movies-container">
        <!-- يتم التحميل هنا -->
    </div>

    <!-- قسم المسلسلات -->
    <div class="section-title" style="margin-top: 15px;">
        <span class="red-line">أبرز المسلسلات</span>
    </div>
    <div class="horizontal-scroll" id="series-container">
        <!-- يتم التحميل هنا -->
    </div>

    <!-- قسم القنوات -->
    <div class="section-title" style="margin-top: 15px;">
        <span class="red-line">القنوات الحية</span>
    </div>
    <div class="horizontal-scroll" id="channels-container">
        <!-- يتم التحميل هنا -->
    </div>

    <!-- مشغل الفيديو الداخلي المنبثق -->
    <div id="player-modal">
        <button class="close-player" onclick="closePlayer()">إغلاق ✕</button>
        <video id="video-stream" controls autoplay playsinline></video>
    </div>

    <!-- شريط التنقل السفلي (أفلام، مسلسلات، قنوات، رئيسية) -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            الرئيسية
        </a>
        <a href="movies.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
            الأفلام
        </a>
        <a href="series.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M18 3v2h-2V3H8v2H6V3H4v18h2v-2h2v2h8v-2h2v2h2V3h-2zM8 17H6v-2h2v2zm0-4H6v-2h2v2zm0-4H6V7h2v2zm10 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2z"/></svg>
            المسلسلات
        </a>
        <a href="channels.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M21 3H3C2 3 1 4 1 5v14c0 1.1.9 2 2 2h18c1 0 2-1 2-2V5c0-1-1-2-2-2zm0 16H3V5h18v14zM8 15h3v-2H8v2zm0-4h3V9H8v2zm5 4h3v-2h-3v2zm0-4h3V9h-3v2z"/></svg>
            القنوات
        </a>
    </nav>

    <!-- الجافاسكريبت المشغل والمتحكم بالبيانات -->
    <script>
        let currentUrl = "";

        document.addEventListener("DOMContentLoaded", function () {
            fetch('config.json')
                .then(response => response.json())
                .then(data => {
                    // تعبئة الأفلام
                    const moviesBox = document.getElementById('movies-container');
                    if(moviesBox && data.movies) {
                        data.movies.forEach(m => {
                            moviesBox.innerHTML += `
                                <div class="media-card" onclick="openPlayer('${m.url || m.episodes_url}')">
                                    <img src="${m.poster}" alt="${m.title}">
                                    <div class="media-title">${m.title}</div>
                                </div>`;
                        });
                    }

                    // تعبئة المسلسلات
                    const seriesBox = document.getElementById('series-container');
                    if(seriesBox && data.series) {
                        data.series.forEach(s => {
                            seriesBox.innerHTML += `
                                <div class="media-card" onclick="openPlayer('${s.episodes_url || s.url}')">
                                    <img src="${s.poster}" alt="${s.title}">
                                    <div class="media-title">${s.title}</div>
                                </div>`;
                        });
                    }
                    
                    // تعبئة القنوات إن وجدت
                    const channelsBox = document.getElementById('channels-container');
                    if(channelsBox && data.channels) {
                        data.channels.forEach(c => {
                            channelsBox.innerHTML += `
                                <div class="media-card" onclick="openPlayer('${c.url}')">
                                    <img src="${c.poster}" alt="${c.title}">
                                    <div class="media-title">${c.title}</div>
                                </div>`;
                        });
                    }
                })
                .catch(err => console.log("خطأ في جلب البيانات:", err));
        });

        function openPlayer(url) {
            if(!url) return;
            currentUrl = url;
            const modal = document.getElementById('player-modal');
            const video = document.getElementById('video-stream');
            
            modal.style.display = 'flex';

            if (Hls.isSupported() && url.includes('.m3u8')) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED,function() {
                    video.play();
                });
            } else {
                video.src = url;
                video.play();
            }
        }

        function closePlayer() {
            const modal = document.getElementById('player-modal');
            const video = document.getElementById('video-stream');
            video.pause();
            video.src = "";
            modal.style.display = 'none';
        }

        function playFeatured() {
            openPlayer("http://blue4k.net:8080/movie/Hanaa/sample.mp4");
        }
    </script>
</body>
</html>
